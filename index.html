<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hub de Révisions</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0f172a;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent-color: #3b82f6;
            --accent-glow: rgba(59, 130, 246, 0.5);
            --card-bg: rgba(30, 41, 59, 0.7);
            --card-border: rgba(255, 255, 255, 0.1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(at 0% 0%, rgba(15, 23, 42, 1) 0, transparent 50%), 
                radial-gradient(at 100% 100%, rgba(30, 58, 138, 0.4) 0, transparent 50%);
            background-attachment: fixed;
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 2rem;
        }

        header {
            text-align: center;
            margin-bottom: 3rem;
            width: 100%;
            max-width: 1000px;
        }

        h1 {
            font-size: 3rem;
            font-weight: 800;
            background: linear-gradient(135deg, #60a5fa, #c084fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 0.5rem;
            letter-spacing: -1px;
        }

        p.subtitle {
            color: var(--text-muted);
            font-size: 1.1rem;
        }

        /* Navigation / Fil d'ariane */
        .nav-bar {
            width: 100%;
            max-width: 1000px;
            display: flex;
            align-items: center;
            gap: 1rem;
            margin-bottom: 2rem;
            background: rgba(15, 23, 42, 0.6);
            padding: 1rem 1.5rem;
            border-radius: 12px;
            border: 1px solid var(--card-border);
            backdrop-filter: blur(10px);
        }

        .btn-back {
            background: transparent;
            border: 1px solid var(--accent-color);
            color: var(--accent-color);
            padding: 0.5rem 1rem;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
            display: none; /* Caché à la racine */
        }

        .btn-back:hover {
            background: var(--accent-color);
            color: white;
            box-shadow: 0 0 15px var(--accent-glow);
        }

        .breadcrumb {
            color: var(--text-muted);
            font-weight: 600;
            font-size: 1.1rem;
        }

        .breadcrumb span {
            color: var(--text-main);
        }

        /* Grille de contenu */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 1.5rem;
            width: 100%;
            max-width: 1000px;
        }

        /* Cartes (Dossiers et Fichiers) */
        .card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            padding: 1.5rem;
            cursor: pointer;
            text-decoration: none;
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            backdrop-filter: blur(12px);
            position: relative;
            overflow: hidden;
        }

        .card::before {
            content: '';
            position: absolute;
            top: 0; left: -100%; width: 50%; height: 100%;
            background: linear-gradient(to right, transparent, rgba(255,255,255,0.05), transparent);
            transform: skewX(-20deg);
            transition: 0.5s;
        }

        .card:hover::before {
            left: 150%;
        }

        .card:hover {
            transform: translateY(-8px);
            border-color: var(--accent-color);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5), 0 0 15px var(--accent-glow);
        }

        .card svg {
            width: 48px;
            height: 48px;
            margin-bottom: 1rem;
            transition: transform 0.3s ease;
        }

        .card:hover svg {
            transform: scale(1.1);
        }

        .card-folder svg { fill: #60a5fa; }
        .card-file svg { fill: #c084fc; }

        .card-title {
            font-size: 1.2rem;
            font-weight: 600;
            word-break: break-word;
        }

        /* Loader */
        .loader {
            display: none;
            width: 50px;
            height: 50px;
            border: 4px solid var(--card-border);
            border-top: 4px solid var(--accent-color);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 3rem auto;
        }

        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        /* Messages */
        .message {
            text-align: center;
            color: var(--text-muted);
            grid-column: 1 / -1;
            padding: 2rem;
        }
    </style>
</head>
<body>

    <header>
        <h1>Mes Révisions</h1>
        <p class="subtitle">Plateforme d'apprentissage dynamique</p>
    </header>

    <div class="nav-bar">
        <button class="btn-back" id="btn-back" onclick="loadRoot()">&#8592; Retour</button>
        <div class="breadcrumb" id="breadcrumb">Racine <span>/</span></div>
    </div>

    <div class="loader" id="loader"></div>
    
    <div class="grid" id="content-grid">
    </div>

    <script>
        // ==========================================
        // CONFIGURATION - À MODIFIER AVEC TES INFOS
        // ==========================================
        const GITHUB_USERNAME = 'Cyprdu'; 
        const GITHUB_REPO = 'ecole';
        
        // ⚠️ REMPLACE "VOTRE_TOKEN_ICI" PAR TON VRAI TOKEN (ex: "ghp_xxxxxxxxxxxx")
        const GITHUB_TOKEN = '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'; 
        // ==========================================

        const API_BASE_URL = `https://api.github.com/repos/${GITHUB_USERNAME}/${GITHUB_REPO}/contents/`;
        
        const grid = document.getElementById('content-grid');
        const loader = document.getElementById('loader');
        const breadcrumb = document.getElementById('breadcrumb');
        const btnBack = document.getElementById('btn-back');

        // Icônes SVG pour le design Pro
        const iconFolder = `<svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M10 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2h-8l-2-2z"/></svg>`;
        const iconFile = `<svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M14 2H6c-1.1 0-1.99.9-1.99 2L4 20c0 1.1.89 2 1.99 2H18c1.1 0 2-.9 2-2V8l-6-6zm2 16H8v-2h8v2zm0-4H8v-2h8v2zm-3-5V3.5L18.5 9H13z"/></svg>`;

        async function fetchContents(path = '') {
            grid.innerHTML = '';
            loader.style.display = 'block';
            
            try {
                // Requête avec le token d'authentification
                const response = await fetch(API_BASE_URL + path, {
                    headers: {
                        'Authorization': `token ${GITHUB_TOKEN}`,
                        'Accept': 'application/vnd.github.v3+json'
                    }
                });
                
                if (!response.ok) {
                    if (response.status === 401 || response.status === 404) {
                        throw new Error("Erreur d'accès : Vérifie que ton Token est correct et qu'il a bien les droits 'repo'.");
                    }
                    throw new Error("Erreur lors de la récupération des données GitHub.");
                }
                
                const data = await response.json();
                renderContent(data, path);
            } catch (error) {
                grid.innerHTML = `<div class="message">${error.message}</div>`;
                console.error(error);
            } finally {
                loader.style.display = 'none';
            }
        }

        function renderContent(data, currentPath) {
            grid.innerHTML = '';
            
            // Mise à jour de la navigation
            if (currentPath === '') {
                breadcrumb.innerHTML = 'Racine <span>/</span>';
                btnBack.style.display = 'none';
            } else {
                breadcrumb.innerHTML = `Racine <span>/</span> ${currentPath}`;
                btnBack.style.display = 'block';
            }

            let itemsCount = 0;

            data.forEach(item => {
                // A la racine, on ne veut montrer que les dossiers
                if (currentPath === '' && item.type === 'dir') {
                    createFolderCard(item);
                    itemsCount++;
                } 
                // Dans un dossier, on ne veut montrer que les fichiers HTML (sauf index.html)
                else if (currentPath !== '' && item.type === 'file' && item.name.endsWith('.html') && item.name !== 'index.html') {
                    createFileCard(item);
                    itemsCount++;
                }
            });

            if (itemsCount === 0) {
                grid.innerHTML = `<div class="message">Aucun fichier de révision trouvé ici.</div>`;
            }
        }

        function createFolderCard(item) {
            const card = document.createElement('div');
            card.className = 'card card-folder';
            card.onclick = () => fetchContents(item.path);
            
            // Nettoyer le nom du dossier pour l'affichage (enlève les tirets par ex)
            const cleanName = item.name.replace(/[-_]/g, ' ');

            card.innerHTML = `
                ${iconFolder}
                <div class="card-title" style="text-transform: capitalize;">${cleanName}</div>
            `;
            grid.appendChild(card);
        }

        function createFileCard(item) {
            const card = document.createElement('a');
            card.className = 'card card-file';
            // Le lien pointe vers le fichier HTML relatif pour que le navigateur l'ouvre
            card.href = `./${item.path}`; 
            
            // Retirer le ".html" pour un affichage plus propre
            const cleanName = item.name.replace('.html', '').replace(/[-_]/g, ' ');

            card.innerHTML = `
                ${iconFile}
                <div class="card-title" style="text-transform: capitalize;">${cleanName}</div>
            `;
            grid.appendChild(card);
        }

        function loadRoot() {
            fetchContents('');
        }

        // Charger la racine au démarrage
        loadRoot();
    </script>
</body>
</html>
