<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Générateur de Sujets SES - Terminale (Mode Entraînement)</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdfmake/0.2.7/pdfmake.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdfmake/0.2.7/vfs_fonts.js"></script>
    
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent-color: #3b82f6;
            --accent-hover: #2563eb;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --success-color: #10b981;
            --danger-color: #ef4444;
            --danger-hover: #dc2626;
        }

        *, *::before, *::after {
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
            padding: 40px 0;
        }

        /* Top Bar Utilities */
        .top-bar {
            position: absolute;
            top: 20px;
            right: 20px;
            display: flex;
            gap: 15px;
            z-index: 10;
        }

        .btn-util {
            background-color: rgba(255, 255, 255, 0.1);
            color: var(--text-main);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.2s ease;
        }

        .btn-util:hover {
            background-color: rgba(255, 255, 255, 0.2);
        }

        /* Main Container arranged for focus */
        .container {
            text-align: center;
            max-width: 850px;
            width: 90%;
            padding: 40px;
            background-color: var(--card-bg);
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 25px;
            transition: transform 0.3s ease;
        }

        /* Timer Dashboard */
        .timer-box {
            font-size: 3rem;
            font-weight: bold;
            font-family: monospace;
            color: #f59e0b;
            background: rgba(0, 0, 0, 0.2);
            padding: 10px 30px;
            border-radius: 12px;
            border: 1px solid rgba(245, 158, 11, 0.3);
            display: inline-block;
            margin-bottom: 10px;
        }

        .timer-controls {
            display: flex;
            gap: 10px;
            margin-top: -15px;
        }

        .btn-timer {
            background: none;
            border: 1px solid var(--text-muted);
            color: var(--text-muted);
            padding: 4px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.85rem;
        }

        .btn-timer:hover {
            color: var(--text-main);
            border-color: var(--text-main);
        }

        /* Stats Counter Badge */
        .status-counter {
            font-size: 1rem;
            color: var(--text-muted);
            font-weight: 600;
            background: rgba(0, 0, 0, 0.15);
            padding: 6px 16px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        /* Displays */
        .display-zone {
            min-height: 120px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            width: 100%;
        }

        h2 {
            font-size: 1.1rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--accent-color);
            margin: 0 0 10px 0;
        }

        .title-display {
            font-size: 1.6rem;
            font-weight: 700;
            line-height: 1.4;
            margin: 0;
            color: var(--text-main);
        }

        .badge {
            display: inline-block;
            padding: 6px 12px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 0.9rem;
            margin-bottom: 15px;
            background-color: #6366f1;
            color: white;
        }

        /* Input text processor area styled workspace */
        .workspace-zone {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 12px;
            text-align: left;
            margin-top: 10px;
        }

        .workspace-label {
            font-size: 1rem;
            color: var(--text-muted);
            font-weight: 600;
            padding-left: 4px;
        }

        .text-processor {
            width: 100%;
            min-height: 280px;
            background-color: #0f172a;
            color: var(--text-main);
            border: 2px solid #334155;
            border-radius: 12px;
            padding: 18px;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            font-size: 1.05rem;
            line-height: 1.6;
            resize: vertical;
            outline: none;
            transition: all 0.2s ease;
        }

        .text-processor:focus {
            border-color: var(--accent-color);
            box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.15);
            background-color: #0b0f19;
        }

        /* Central Action Buttons */
        .btn-main {
            background-color: var(--accent-color);
            color: white;
            border: none;
            padding: 16px 32px;
            font-size: 1.2rem;
            font-weight: bold;
            border-radius: 12px;
            cursor: pointer;
            box-shadow: 0 4px 14px rgba(59, 130, 246, 0.4);
            transition: all 0.2s ease;
        }

        .btn-main:hover {
            background-color: var(--accent-hover);
            transform: translateY(-2px);
        }

        .btn-secondary {
            background-color: var(--success-color);
            box-shadow: 0 4px 14px rgba(16, 185, 129, 0.4);
        }

        .btn-secondary:hover {
            background-color: #059669;
        }

        .btn-danger {
            background-color: var(--danger-color);
            box-shadow: 0 4px 14px rgba(239, 68, 68, 0.4);
        }

        .btn-danger:hover {
            background-color: var(--danger-hover);
            transform: translateY(-2px);
        }

        .button-group {
            display: flex;
            gap: 15px;
            width: 100%;
            justify-content: center;
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>

    <div class="top-bar">
        <button class="btn-util" onclick="if(confirm('Voulez-vous réinitialiser la session actuelle et effacer le cache des réponses ?')) { clearSessionCache(); }">🗑️ Reset Session</button>
        <button class="btn-util" onclick="toggleFullscreen()">🖥️ Plein Écran</button>
    </div>

    <div class="container">
        
        <div>
            <div class="timer-box" id="timerDisplay">45:00</div>
            <div class="timer-controls">
                <button class="btn-timer" onclick="startTimer()">Démarrer</button>
                <button class="btn-timer" onclick="pauseTimer()">Pause</button>
                <button class="btn-timer" onclick="resetTimer()">Reset</button>
            </div>
        </div>

        <div class="status-counter">
            📚 Plans enregistrés dans cette session : <span id="savedCount" style="color: var(--success-color); font-weight: bold;">0</span>
        </div>

        <hr style="width:100%; border:0; border-top:1px solid rgba(255,255,255,0.1); margin: 5px 0;">

        <div class="display-zone" id="displayZone">
            <p style="color: var(--text-muted); font-size: 1.2rem; font-style: italic;">Cliquez sur un bouton ci-dessous pour démarrer le tirage automatique continu.</p>
        </div>

        <div class="workspace-zone hidden" id="workspaceZone">
            <label class="workspace-label" for="userAnswer">Votre Plan Détaillé (gère les sauts de ligne) :</label>
            <textarea class="text-processor" id="userAnswer" placeholder="Rédigez l'introduction, les grandes parties (I, II...) et les sous-parties de votre plan détaillé ici... Utilisez librement la touche Entrée pour revenir à la ligne."></textarea>
            
            <div class="button-group" style="margin-top: 10px;">
                <button class="btn-main" id="btnSubmitAnswer" onclick="submitAndNext()" style="flex: 1;">📥 Soumettre & Suivant</button>
                <button class="btn-main btn-danger" id="btnStopSession" onclick="stopAndGeneratePDF()" style="flex: 1;">🛑 Arrêter & Télécharger le PDF</button>
            </div>
        </div>

        <div id="initialControls" style="display: flex; flex-direction: column; gap: 15px; width: 100%; align-items: center;">
            <button class="btn-main" id="btnDrawChapter" onclick="drawChapter()">🎲 Tirer un Chapitre au Sort</button>
            <button class="btn-main btn-secondary hidden" id="btnDrawQuestion" onclick="drawQuestion()">📝 Piocher une Question</button>
            <button class="btn-main btn-secondary" id="btnContinuousMode" onclick="startContinuousMode()" style="background-color: #6366f1; box-shadow: 0 4px 14px rgba(99, 102, 241, 0.4);">🔄 Lancer le Mode Continu Toutes Catégories</button>
        </div>

    </div>

    <script>
        const dataset = [
            {

                    { type: "EC3", text: "Vous montrerez que les classes sociales restent un outil pertinent pour analyser la société française contemporaine, malgré les dynamiques de recomposition." },
                    { type: "EC3", text: "Vous montrerez comment l'évolution de la structure socioprofessionnelle a transformé la société française actuelle." },
                    { type: "EC1", text: "Montrez que la catégorie socioprofessionnelle/ le sexe/ l’âge / le lieu de résidence/ la position dans le cycle de vie / est un facteur de structuration et de hiérarchisation de l’espace social." },

            {

                    { type: "EC3", text: "Vous montrerez que les raisons de l’engagement politique répondent à différentes logiques." },
                    { type: "EC1", text: "Montrer en quoi la consommation engagée est une forme d’engagement politique." },
                    { type: "EC1", text: "Expliquer en quoi les comportements de passagers clandestins nuisent à l’action collective." },

            {

                    { type: "EC1", text: "Montrez qu’une l’évolution de la structure socioprofessionnelle contribue à expliquer la mobilité sociale." },
                    { type: "EC1", text: "Montrez à l’aide d’un exemple que les ressources et configurations familiales contribuent à expliquer la mobilité sociale." },
                    { type: "EC3", text: "Montrez les effets de l'évolution de la structure par catégories socioprofessionnelles sur la mobilité sociale." },
                    { type: "EC3", text: "Vous démontrerez que la famille peut constituer un frein à la mobilité sociale des individus." },
                    { type: "EC3", text: "Vous montrerez que l'école ne parvient pas toujours à assurer une mobilité sociale." },
                    { type: "EC1", text: "Distinguez la mobilité sociale intergénérationnelle de la mobilité sociale professionnelle" },
                    { type: "EC2", text: "Table de destinée sociale - vous illustrerez et expliquerez une situation de mobilité sociale ascendante et une situation de reproduction sociale" },
                    { type: "EC3", text: "Vous montrerez qu'une société plus mobile n'est pas nécessairement plus fluide" },

            },
            {
                chapter: "Quels sont les fondements du commerce international ?",
                questions: [
                    { type: "EC1", text: "Expliquez comment les dotations technologiques et factorielles déterminent la spécialisation internationale." },
                    { type: "EC1", text: "Distinguez le commerce inter-branche du commerce intra-branche." },
                    { type: "EC1", text: "Présentez un argument économique justifiant la mise en place de mesures protectionnistes." },

                    { type: "EC3", text: "Vous montrerez comment l'internationalisation des chaînes de valeur transforme l'organisation mondiale du commerce." },
                    { type: "EC3", text: "Vous montrerez que si le libre-échange engendre globalement des gains de productivité, il génère aussi des inégalités internes." },
                    { type: "EC1", text: "Expliquez le rôle des dotations factorielles dans les échanges commerciaux." },
                    { type: "EC1", text: "Présentez le lien entre avantage comparatif et commerce international." },
                    { type: "EC1", text: "Montrez que l‘avantage comparatif peut naître de la dotation factorielle d’un pays." },
                    { type: "EC1", text: "Expliquez le rôle des dotations technologiques dans la spécialisation internationale." },
                    { type: "EC1", text: "A l’aide d’un exemple, expliquez l’internationalisation de la chaîne de valeur." },
                    { type: "EC1", text: "Comment les entreprises internationalisent-elles leurs chaînes de valeur ?" },
                    { type: "EC1", text: "Présentez les différents types de compétitivité." },
                    { type: "EC1", text: "Quel rôle joue la productivité des entreprises dans la compétitivité des pays ?" },
                    { type: "EC1", text: "Expliquez comment la mondialisation peut accroître les inégalités au sein des pays les plus riches." },
                    { type: "EC1", text: "Présentez un avantage et un inconvénient du protectionnisme." },
                    { type: "EC1", text: "Quels sont les principes et les modalités du protectionnisme ?" }
                ]
            },
            {
                chapter: "Sources et défis de la croissance économique",
                questions: [
                    { type: "EC1", text: "Présentez le lien entre productivité globale des facteurs et progrès technique." },
                    { type: "EC1", text: "Montrez, à l'aide d'un exemple, comment le progrès technique peut contribuer à la croissance économique." },
                    { type: "EC1", text: "Montrez que le facteur capital est source de croissance économique." },
                    { type: "EC1", text: "Montrez à l'aide d'un exemple que le progrès technique résulte de l’innovation." },
                    { type: "EC1", text: "Montrez à l’aide d’un exemple que les droits de propriété favorisent la croissance économique." },
                    { type: "EC1", text: "Montrez à l’aide d’un exemple que l’innovation s’accompagne d’un processus de destruction créatrice." },
                    { type: "EC1", text: "Montrez que le progrès technique peut engendrer des inégalités de revenu." },
                    { type: "EC1", text: "Montrez que la croissance économique se heurte à des limites écologiques." },
                    { type: "EC1", text: "Montrez à l’aide d’un exemple comment l’innovation peut aider à reculer les limites écologiques de la croissance." },
                    { type: "EC3", text: "Vous montrerez comment le progrès technique favorise la croissance économique." },
                    { type: "EC3", text: "Vous montrerez comment l’accumulation des facteurs contribue à la croissance." },
                    { type: "EC3", text: "Vous montrerez que le progrès technique a un caractère endogène." },
                    { type: "EC3", text: "Vous montrerez que le progrès technique est facteur de croissance." },
                    { type: "EC3", text: "Vous montrerez que les institutions jouent un rôle dans la croissance économique." },
                    { type: "EC3", text: "Vous montrerez que la croissance économique rencontre des défis." },
                    { type: "EC3", text: "Vous montrerez comment l’innovation peut être une solution aux limites écologiques de la croissance économique." },
                    { type: "EC3", text: "Vous montrerez que le progrès technique peut engendrer des inégalités de revenus." },
                    { type: "EC1", text: "Comment les droits de propriété favorisent-ils la croissance économique ?" },
                    { type: "EC1", text: "En quoi les facteurs de production peuvent-ils être source de croissance économique ?" },
                    { type: "EC1", text: "En quoi la PGF peut-elle être source de croissance économique ?" },
                    { type: "EC1", text: "Montrez que le progrès technique peut être source de croissance endogène." },
                    { type: "EC1", text: "En quoi l’innovation peut-elle s’accompagner d’un processus de destruction-créatrice ?" },
                    { type: "EC1", text: "En quoi le progrès technique peut-il rendre la croissance soutenable ?" },
                    { type: "EC1", text: "En quoi la pollution est-elle une limite à la croissance économique ?" },
                    { type: "EC1", text: "Montrez une limite écologique à la croissance économique." }
                ]
            }
        ];

        let currentChapterIndex = null;
        let currentActiveQuestion = null;
        let cachedAnswers = [];

        try {
            const stored = localStorage.getItem('ses_cached_answers');
            if (stored) {
                cachedAnswers = JSON.parse(stored);
            }
        } catch (e) {
            console.warn("L'accès au cache local est bloqué par le navigateur, la sauvegarde automatique sera désactivée pour cette session.", e);
        }

        updateCounterDisplay();

        function updateCounterDisplay() {
            document.getElementById("savedCount").innerText = cachedAnswers.length;
        }

        function startContinuousMode() {
            document.getElementById("initialControls").style.display = "none";
            drawRandomQuestionAcrossAll();
        }

        function drawRandomQuestionAcrossAll() {
            currentChapterIndex = Math.floor(Math.random() * dataset.length);
            const chapter = dataset[currentChapterIndex];
            const randomQuestion = chapter.questions[Math.floor(Math.random() * chapter.questions.length)];
            
            displayQuestion(chapter.chapter, randomQuestion);
        }

        function drawChapter() {
            currentChapterIndex = Math.floor(Math.random() * dataset.length);
            const selected = dataset[currentChapterIndex];

            const displayZone = document.getElementById("displayZone");
            displayZone.innerHTML = `
                <h2>Chapitre Sélectionné</h2>
                <p class="title-display">${selected.chapter}</p>
            `;

            document.getElementById("btnDrawQuestion").classList.remove("hidden");
            document.getElementById("workspaceZone").classList.add("hidden");
        }

        function drawQuestion() {
            if (currentChapterIndex === null) return;
            
            const questions = dataset[currentChapterIndex].questions;
            const randomQuestion = questions[Math.floor(Math.random() * questions.length)];

            displayQuestion(dataset[currentChapterIndex].chapter, randomQuestion);
            document.getElementById("initialControls").style.display = "none";
        }

        function displayQuestion(chapterTitle, questionObj) {
            currentActiveQuestion = {
                chapter: chapterTitle,
                type: questionObj.type,
                text: questionObj.text
            };

            const displayZone = document.getElementById("displayZone");
            displayZone.innerHTML = `
                <h2>${chapterTitle}</h2>
                <div style="margin-top: 15px;">
                    <span class="badge">${questionObj.type}</span>
                    <p class="title-display" style="font-size: 1.4rem; font-weight: 500;">${questionObj.text}</p>
                </div>
            `;

            document.getElementById("workspaceZone").classList.remove("hidden");
            const textarea = document.getElementById("userAnswer");
            textarea.value = "";
            textarea.focus();
        }

        function saveToCache(answerNode) {
            cachedAnswers.push(answerNode);
            try {
                localStorage.setItem('ses_cached_answers', JSON.stringify(cachedAnswers));
            } catch (e) {
            }
            updateCounterDisplay();
        }

        function submitAndNext() {
            const answerField = document.getElementById("userAnswer");
            const answerText = answerField.value.trim();

            if (!currentActiveQuestion) return;

            if (answerText === "") {
                const skip = confirm("Votre espace de saisie est vide. Souhaitez-vous passer à une autre problématique sans enregistrer de plan ?");
                if (!skip) return;
            } else {
                const answerNode = {
                    chapter: currentActiveQuestion.chapter,
                    type: currentActiveQuestion.type,
                    question: currentActiveQuestion.text,
                    answer: answerText,
                    timestamp: new Date().toLocaleString('fr-FR')
                };
                saveToCache(answerNode);
            }

            drawRandomQuestionAcrossAll();
        }

        function stopAndGeneratePDF() {
            generateStructuredPDF();
        }

        // Nouvelle fonction avec pdfmake
        function generateStructuredPDF() {
            const answerField = document.getElementById("userAnswer");
            const answerText = answerField.value.trim();

            if (answerText !== "" && currentActiveQuestion) {
                const answerNode = {
                    chapter: currentActiveQuestion.chapter,
                    type: currentActiveQuestion.type,
                    question: currentActiveQuestion.text,
                    answer: answerText,
                    timestamp: new Date().toLocaleString('fr-FR')
                };
                saveToCache(answerNode);
                answerField.value = ""; 
            }

            if (cachedAnswers.length === 0) {
                alert("Vous n'avez rédigé et soumis aucun plan détaillé pour le moment.");
                return;
            }

            const docDefinition = {
                info: {
                    title: 'Plans_Detailles_Entrainement',
                },
                pageMargins: [40, 60, 40, 60],
                content: [
                    { text: "Session d'Entraînement : Plans Détaillés", style: 'mainTitle' },
                    { text: `Généré automatiquement le ${new Date().toLocaleDateString('fr-FR')} à ${new Date().toLocaleTimeString('fr-FR')}`, style: 'subTitle' },
                    { text: "Prêt pour relecture", style: 'successTag', margin: [0, 0, 0, 30] }
                ],
                styles: {
                    mainTitle: { fontSize: 22, bold: true, color: '#1e3a8a', alignment: 'center', margin: [0, 0, 0, 5] },
                    subTitle: { fontSize: 11, color: '#4b5563', alignment: 'center', margin: [0, 0, 0, 5] },
                    successTag: { fontSize: 10, bold: true, italics: true, color: '#10b981', alignment: 'center' },
                    chapterTag: { fontSize: 10, bold: true, color: '#6b7280', margin: [0, 20, 0, 5] },
                    questionBlock: { margin: [0, 0, 0, 15] },
                    typeBadge: { fontSize: 12, bold: true, color: '#4f46e5' },
                    questionText: { fontSize: 14, bold: true, color: '#111827' },
                    answerHeader: { fontSize: 11, bold: true, color: '#374151', margin: [0, 10, 0, 8] },
                    answerContent: { fontSize: 11, color: '#1f2937', margin: [0, 0, 0, 20], lineHeight: 1.4 }
                },
                defaultStyle: {
                    font: 'Roboto'
                }
            };

            cachedAnswers.forEach((item, index) => {
                docDefinition.content.push(
                    { text: `CHAPITRE : ${item.chapter.toUpperCase()}`, style: 'chapterTag', unbreakable: true },
                    {
                        text: [
                            { text: `[${item.type}] `, style: 'typeBadge' },
                            { text: `Sujet N°${index + 1} : ${item.question}`, style: 'questionText' }
                        ],
                        style: 'questionBlock',
                        unbreakable: true 
                    },
                    { text: 'Plan Rédigé :', style: 'answerHeader' },
                    { text: item.answer, style: 'answerContent' },
                    { canvas: [{ type: 'line', x1: 0, y1: 0, x2: 515, y2: 0, lineWidth: 1, lineColor: '#e5e7eb' }], margin: [0, 10, 0, 10] }
                );
            });

            pdfMake.createPdf(docDefinition).download(`Plans_Detailles_${new Date().toISOString().slice(0,10)}.pdf`);

            if (confirm("Votre PDF a été généré avec succès ! Souhaitez-vous vider le cache pour démarrer une nouvelle session ?")) {
                clearSessionCache();
            }
        }

        function clearSessionCache() {
            cachedAnswers = [];
            try {
                localStorage.removeItem('ses_cached_answers');
            } catch (e) {
            }
            updateCounterDisplay();
            document.getElementById("userAnswer").value = "";
            document.getElementById("workspaceZone").classList.add("hidden");
            document.getElementById("initialControls").style.display = "flex";
            document.getElementById("btnDrawQuestion").classList.add("hidden");
            document.getElementById("displayZone").innerHTML = `
                <p style="color: var(--text-muted); font-size: 1.2rem; font-style: italic;">Session réinitialisée. Cliquez sur un bouton ci-dessous pour lancer ton tirage.</p>
            `;
        }

        let timerInterval;
        let initialTime = 45 * 60; 
        let timeLeft = initialTime;

        function updateTimerDisplay() {
            let minutes = Math.floor(timeLeft / 60);
            let seconds = timeLeft % 60;
            document.getElementById("timerDisplay").innerText = 
                `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
        }

        function startTimer() {
            clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                if(timeLeft > 0) {
                    timeLeft--;
                    updateTimerDisplay();
                } else {
                    clearInterval(timerInterval);
                    alert("Le temps imparti pour l'exercice (45 min) est écoulé !");
                }
            }, 1000);
        }

        function pauseTimer() {
            clearInterval(timerInterval);
        }

        function resetTimer() {
            clearInterval(timerInterval);
            timeLeft = initialTime;
            updateTimerDisplay();
        }

        function toggleFullscreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(err => {
                    alert(`Erreur d'activation : ${err.message}`);
                });
            } else {
                document.exitFullscreen();
            }
        }
    </script>
