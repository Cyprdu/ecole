<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Glossaire OT — Apprentissage</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #111214;
    --panel: #17181B;
    --border: #26282C;
    --text: #E6E7EA;
    --text-dim: #9AA0A6;
    --text-faint: #5B6066;
    --accent: #6C8EF0;
    --accent-dim: #2A3550;
    --error: #C4685A;
    --error-dim: #3A2925;
    --mono: 'JetBrains Mono', monospace;
    --sans: 'Inter', sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{background:var(--bg);color:var(--text);font-family:var(--sans);min-height:100vh;font-size:15px;}
  .wrap{max-width:640px;margin:0 auto;padding:0 20px;}
  svg{display:block;}
  .icon{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.6;flex:none;}

  header{border-bottom:1px solid var(--border);padding:22px 0 0;}
  h1{font-size:16px;font-weight:600;margin:0 0 2px;}
  .subtitle{font-size:13px;color:var(--text-faint);margin-bottom:18px;}

  nav{display:flex;gap:18px;overflow-x:auto;}
  .tab{
    font-family:var(--sans);font-size:13.5px;font-weight:500;
    background:none;border:none;color:var(--text-faint);
    padding:0 0 12px;cursor:pointer;white-space:nowrap;
    border-bottom:2px solid transparent;
  }
  .tab.active{color:var(--text);border-bottom-color:var(--accent);}
  .tab .count{color:var(--text-faint);font-family:var(--mono);font-size:11.5px;margin-left:4px;}
  .tab.active .count{color:var(--accent);}

  main{padding:26px 0 60px;}

  p{color:var(--text-dim);line-height:1.55;font-size:14px;margin:0 0 14px;}
  h2{font-size:16px;font-weight:600;margin:0 0 8px;}

  .section{margin-bottom:22px;}
  .row-list{border-top:1px solid var(--border);}
  .row-link{
    display:flex;align-items:center;gap:12px;width:100%;text-align:left;
    background:none;border:none;border-bottom:1px solid var(--border);
    padding:14px 2px;cursor:pointer;color:var(--text);
  }
  .row-link:hover .row-title{color:var(--accent);}
  .row-link .row-body{flex:1;min-width:0;}
  .row-title{font-size:14.5px;font-weight:500;}
  .row-desc{font-size:12.5px;color:var(--text-faint);margin-top:2px;}
  .row-meta{font-family:var(--mono);font-size:12px;color:var(--text-faint);}
  .row-link .icon{color:var(--text-dim);}

  /* ---- generic panel used for prompts/summaries ---- */
  .panel{border:1px solid var(--border);border-radius:6px;padding:20px;margin-bottom:14px;}

  .meta-line{display:flex;align-items:center;gap:8px;color:var(--text-faint);font-size:12px;margin-bottom:14px;}
  .meta-line .icon{width:15px;height:15px;}
  .stage-tag{font-family:var(--mono);color:var(--text-dim);}

  .progress-track{height:3px;background:var(--border);border-radius:2px;overflow:hidden;margin-bottom:18px;}
  .progress-fill{height:100%;background:var(--accent);width:0%;transition:width .2s;}

  .prompt-text{font-size:17px;line-height:1.5;margin-bottom:22px;}
  .prompt-text .abbr-large{font-family:var(--mono);font-size:26px;font-weight:600;letter-spacing:.5px;}

  .choices{display:grid;gap:8px;}
  .choice-btn{
    text-align:left;font-family:var(--sans);font-size:14.5px;
    background:var(--panel);border:1px solid var(--border);color:var(--text);
    padding:12px 14px;border-radius:5px;cursor:pointer;
  }
  .choice-btn:hover{border-color:var(--text-dim);}
  .choice-btn.correct{border-color:var(--accent);color:var(--accent);}
  .choice-btn.wrong{border-color:var(--error);color:var(--error);}
  .choice-btn:disabled{cursor:default;}

  .input-row{display:flex;gap:8px;}
  input[type=text]{
    flex:1;font-family:var(--sans);font-size:15px;
    background:var(--panel);border:1px solid var(--border);color:var(--text);
    padding:12px 14px;border-radius:5px;outline:none;
  }
  input[type=text]:focus{border-color:var(--accent);}

  .btn{
    font-family:var(--sans);font-weight:500;font-size:14px;
    background:var(--accent);color:#0F1320;border:none;
    padding:11px 18px;border-radius:5px;cursor:pointer;
  }
  .btn.secondary{background:none;color:var(--text-dim);border:1px solid var(--border);}
  .btn:disabled{opacity:.4;cursor:default;}

  .feedback{margin-top:16px;padding-top:14px;border-top:1px solid var(--border);}
  .feedback .verdict{font-size:13px;font-weight:600;margin-bottom:6px;}
  .feedback.ok .verdict{color:var(--accent);}
  .feedback.ko .verdict{color:var(--error);}
  .feedback .answer{font-family:var(--mono);font-size:15px;margin-bottom:4px;}
  .feedback .role{font-size:13px;color:var(--text-dim);}
  .feedback .next{font-size:12px;color:var(--text-faint);margin-top:8px;}

  .actions{display:flex;justify-content:flex-end;margin-top:16px;}

  /* ---- cards browse ---- */
  .flip-card{perspective:1200px;height:180px;cursor:pointer;margin-bottom:14px;}
  .flip-inner{position:relative;width:100%;height:100%;transition:transform .4s;transform-style:preserve-3d;}
  .flip-card.flipped .flip-inner{transform:rotateY(180deg);}
  .flip-face{
    position:absolute;inset:0;backface-visibility:hidden;
    border:1px solid var(--border);border-radius:6px;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:18px;text-align:center;gap:8px;
  }
  .flip-front .abbr{font-family:var(--mono);font-size:28px;font-weight:600;}
  .flip-back{transform:rotateY(180deg);}
  .flip-back .full{font-family:var(--mono);font-size:13.5px;color:var(--accent);}
  .flip-back .role{font-size:13px;color:var(--text-dim);}
  .browse-nav{display:flex;justify-content:space-between;align-items:center;}
  .pos{font-family:var(--mono);font-size:12px;color:var(--text-faint);}

  .score-big{font-family:var(--mono);font-size:38px;font-weight:600;margin-bottom:4px;}
  .test-row{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--border);font-size:13.5px;}
  .test-row:last-child{border-bottom:none;}
  .test-row .ok{color:var(--accent);}
  .test-row .ko{color:var(--error);}

  .stat-table{border-top:1px solid var(--border);}
  .stat-row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--border);font-size:13.5px;}
  .stat-row .name{display:flex;align-items:center;gap:10px;}
  .stat-row .icon{color:var(--text-dim);}
  .stat-row .due-now{color:var(--accent);font-family:var(--mono);font-size:12px;}
  .stat-row .due-later{color:var(--text-faint);font-family:var(--mono);font-size:12px;}

  .empty-state{text-align:center;padding:36px 10px;}
  .empty-state .icon{width:28px;height:28px;margin:0 auto 12px;color:var(--accent);}
</style>
</head>
<body>

<header>
  <div class="wrap">
    <h1>Glossaire OT</h1>
    <div class="subtitle">23 abréviations · rappel actif et répétition espacée</div>
    <nav id="navTabs"></nav>
  </div>
</header>

<main class="wrap">
  <div id="app"></div>
</main>

<script>
(function(){

/* ================= ICONS (inline SVG, stroke only) ================= */
const ICONS = {
  fond: '<svg class="icon" viewBox="0 0 24 24"><path d="M12 3 3 8l9 5 9-5-9-5Z"/><path d="M3 12l9 5 9-5"/><path d="M3 16l9 5 9-5"/></svg>',

  reseau: '<svg class="icon" viewBox="0 0 24 24"><circle cx="5" cy="6" r="2.2"/><circle cx="19" cy="6" r="2.2"/><circle cx="12" cy="18" r="2.2"/><path d="M6.9 7.4 10.5 16M17.1 7.4 13.5 16M7.2 6h9.6"/></svg>',
  secu: '<svg class="icon" viewBox="0 0 24 24"><path d="M12 3l7 3v5c0 4.5-3 8-7 10-4-2-7-5.5-7-10V6l7-3Z"/></svg>',

  target: '<svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="4"/><circle cx="12" cy="12" r="0.6" fill="currentColor"/></svg>',
  brain: '<svg class="icon" viewBox="0 0 24 24"><path d="M9 4a3 3 0 0 0-3 3 3 3 0 0 0-2 5 3 3 0 0 0 2 5h1a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2Z"/><path d="M15 4a3 3 0 0 1 3 3 3 3 0 0 1 2 5 3 3 0 0 1-2 5h-1a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2Z"/></svg>',
  layers: '<svg class="icon" viewBox="0 0 24 24"><path d="M12 3 3 8l9 5 9-5-9-5Z"/><path d="M3 12l9 5 9-5"/></svg>',
  pencil: '<svg class="icon" viewBox="0 0 24 24"><path d="M4 20l1-4L16 5l3 3L8 19l-4 1Z"/></svg>',
  chart: '<svg class="icon" viewBox="0 0 24 24"><path d="M4 20V10M12 20V4M20 20v-7"/></svg>',
  arrowLeft: '<svg class="icon" viewBox="0 0 24 24"><path d="M15 19 8 12l7-7"/></svg>',
  arrowRight: '<svg class="icon" viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg>',
};

/* ================= DATA ================= */
const DATA = [
  {id:'OT',   abbr:'OT',    full:'Operational Technology',        role:"Technologies permettant de contrôler les processus industriels.", cat:'fond'},
  {id:'IT',   abbr:'IT',    full:'Information Technology',        role:"Technologies de traitement et de gestion de l'information.", cat:'fond'},
  {id:'ICS',  abbr:'ICS',   full:'Industrial Control System',     role:"Système de contrôle industriel regroupant PLC, SCADA, HMI, etc.", cat:'fond'},
  {id:'MES',  abbr:'MES',   full:'Manufacturing Execution System',role:"Système de pilotage de la production.", cat:'fond'},
  {id:'ERP',  abbr:'ERP',   full:'Enterprise Resource Planning',  role:"Progiciel de gestion intégré de l'entreprise.", cat:'fond'},

  {id:'PLC',  abbr:'PLC',   full:'Programmable Logic Controller', role:"Automate programmable industriel qui contrôle les procédés.", cat:'terrain'},
  {id:'HMI',  abbr:'HMI',   full:'Human Machine Interface',       role:"Interface Homme-Machine permettant à l'opérateur d'interagir avec le système.", cat:'terrain'},
  {id:'SCADA',abbr:'SCADA', full:'Supervisory Control And Data Acquisition', role:"Système de supervision et d'acquisition de données.", cat:'terrain'},
  {id:'DCS',  abbr:'DCS',   full:'Distributed Control System',    role:"Système de contrôle distribué utilisé dans les grands procédés industriels.", cat:'terrain'},
  {id:'RTU',  abbr:'RTU',   full:'Remote Terminal Unit',          role:"Unité terminale distante utilisée pour collecter et transmettre des données.", cat:'terrain'},
  {id:'IO',   abbr:'I/O',   full:'Input / Output',                role:"Entrées et sorties d'un automate ou d'un équipement.", cat:'terrain'},
  {id:'CPU',  abbr:'CPU',   full:'Central Processing Unit',       role:"Processeur principal d'un automate ou d'un ordinateur.", cat:'terrain'},
  {id:'OEM',  abbr:'OEM',   full:'Original Equipment Manufacturer',role:"Fabricant d'origine de l'équipement.", cat:'terrain'},

  {id:'IP',   abbr:'IP',    full:'Internet Protocol',             role:"Adresse réseau identifiant un équipement connecté.", cat:'reseau'},
  {id:'MAC',  abbr:'MAC',   full:'Media Access Control Address',  role:"Adresse physique unique d'une carte réseau.", cat:'reseau'},
  {id:'VLAN', abbr:'VLAN',  full:'Virtual Local Area Network',    role:"Réseau local virtuel permettant de segmenter le réseau.", cat:'reseau'},
  {id:'LAN',  abbr:'LAN',   full:'Local Area Network',            role:"Réseau local.", cat:'reseau'},
  {id:'WAN',  abbr:'WAN',   full:'Wide Area Network',             role:"Réseau étendu reliant plusieurs sites.", cat:'reseau'},
  {id:'DMZ',  abbr:'DMZ',   full:'Demilitarized Zone',            role:"Zone intermédiaire sécurisée entre les réseaux IT et OT.", cat:'reseau'},

  {id:'IDS',  abbr:'IDS',   full:'Intrusion Detection System',    role:"Système de détection d'intrusion.", cat:'secu'},
  {id:'IPS',  abbr:'IPS',   full:'Intrusion Prevention System',   role:"Système de prévention d'intrusion.", cat:'secu'},
  {id:'FW',   abbr:'FW',    full:'Firewall',                      role:"Pare-feu de protection réseau.", cat:'secu'},
  {id:'VPN',  abbr:'VPN',   full:'Virtual Private Network',       role:"Réseau privé virtuel.", cat:'secu'},
];

const CAT_LABELS = {fond:'Fondamentaux', terrain:'Automatismes & terrain', reseau:'Réseau', secu:'Cybersécurité'};

// spacing intervals in days once a term is "maîtrisé" (stage 4)
const INTERVALS = [0, 1, 3, 7, 16, 35];
const DAY_MS = 24*60*60*1000;
const STORAGE_KEY = 'ot-glossary-progress-v2';
const STOPWORDS = new Set(['the','a','an','of','and','for','to','&','system','control']);

/* ================= STORAGE ================= */
let progress = {};

async function loadProgress(){
  try{
    const res = await window.storage.get(STORAGE_KEY, false);
    if(res && res.value){ progress = JSON.parse(res.value); return; }
  }catch(e){ /* first run: key absent */ }
  progress = {};
}
function initMissingCards(){
  const now = Date.now();
  DATA.forEach(c=>{
    if(!progress[c.id]) progress[c.id] = {stage:0, box:0, due:now};
  });
}
let saveTimer=null;
function saveProgress(){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(()=>{
    window.storage.set(STORAGE_KEY, JSON.stringify(progress), false).catch(()=>{});
  }, 150);
}

/* ================= TEXT MATCHING ================= */
function stripAccents(s){ return s.normalize('NFD').replace(/[\u0300-\u036f]/g,''); }
function normalizeAbbr(s){ return stripAccents((s||'')).toUpperCase().replace(/[^A-Z0-9]/g,''); }
function wordsOf(s){
  return stripAccents((s||'')).toLowerCase()
    .replace(/[^a-z0-9\s]/g,' ')
    .split(/\s+/).filter(w=>w && !STOPWORDS.has(w));
}
function levenshtein(a,b){
  const m=a.length,n=b.length;
  const d=Array.from({length:m+1},(_,i)=>[i,...Array(n).fill(0)]);
  for(let j=0;j<=n;j++) d[0][j]=j;
  for(let i=1;i<=m;i++) for(let j=1;j<=n;j++){
    d[i][j]=Math.min(d[i-1][j]+1, d[i][j-1]+1, d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));
  }
  return d[m][n];
}
function matchAbbr(input, card){ return normalizeAbbr(input)===normalizeAbbr(card.abbr); }
function matchFull(input, card){
  const inWords = wordsOf(input);
  const targetWords = wordsOf(card.full);
  if(inWords.length===0 || targetWords.length===0) return false;
  let matched = 0;
  targetWords.forEach(tw=>{
    const tol = tw.length>5 ? 2 : 1;
    if(inWords.some(iw => iw===tw || levenshtein(iw,tw)<=tol)) matched++;
  });
  return matched/targetWords.length >= 0.75;
}

/* ================= HELPERS ================= */
function shuffle(arr){
  const a=arr.slice();
  for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}
function interleave(cards){
  const groups={};
  cards.forEach(c=>{ (groups[c.cat]=groups[c.cat]||[]).push(c); });
  Object.keys(groups).forEach(k=>groups[k]=shuffle(groups[k]));
  const keys=shuffle(Object.keys(groups));
  const out=[];
  let more=true;
  while(more){ more=false; for(const k of keys){ if(groups[k].length){ out.push(groups[k].shift()); more=true; } } }
  return out;
}
function isDue(card){
  const st = progress[card.id];
  return st.stage < 4 || st.due <= Date.now();
}
function dueCards(){ return DATA.filter(isDue); }
function fmtDays(ms){
  const d = Math.round(ms/DAY_MS);
  if(d<=0) return "aujourd'hui";
  if(d===1) return "demain";
  return `dans ${d} j`;
}
function distractorsFor(card, n, key){
  const sameCat = DATA.filter(c=>c.cat===card.cat && c.id!==card.id);
  const others = DATA.filter(c=>c.cat!==card.cat && c.id!==card.id);
  return shuffle(sameCat).concat(shuffle(others)).slice(0,n);
}
function el(tag, cls, html){
  const e = document.createElement(tag);
  if(cls) e.className = cls;
  if(html!==undefined) e.innerHTML = html;
  return e;
}

/* ================= ROUTER ================= */
const TABS = [
  {id:'home', label:'Accueil'},
  {id:'pretest', label:'Pré-test'},
  {id:'learn', label:'Apprendre'},
  {id:'cards', label:'Cartes'},
  {id:'test', label:'Test'},
  {id:'stats', label:'Progression'},
];
let currentTab='home';
let session=null;
let browseIndex=0;

function renderNav(){
  const nav = document.getElementById('navTabs');
  nav.innerHTML='';
  TABS.forEach(t=>{
    const btn = el('button','tab'+(currentTab===t.id?' active':''), t.label);
    if(t.id==='learn'){
      const n = dueCards().length;
      if(n>0) btn.innerHTML += `<span class="count">${n}</span>`;
    }
    btn.onclick = ()=>{ session=null; currentTab=t.id; render(); };
    nav.appendChild(btn);
  });
}
function render(){
  renderNav();
  const app = document.getElementById('app');
  app.innerHTML='';
  ({home:renderHome, pretest:renderPretest, learn:renderLearn, cards:renderCards, test:renderTest, stats:renderStats})[currentTab](app);
}

/* ================= HOME ================= */
function renderHome(app){
  const intro = el('div','section', `<p>Chaque terme passe par quatre étapes : reconnaissance à choix multiples dans les deux sens,
  puis rappel écrit sans indice dans les deux sens. Une fois ces quatre étapes réussies, le terme repasse
  à intervalles croissants pour l'ancrer durablement.</p>`);
  app.appendChild(intro);

  const list = el('div','row-list');
  const items = [
    {id:'pretest', icon:ICONS.target, title:'Pré-test', desc:"Se tester avant d'étudier, pour repérer ce qui manque"},
    {id:'learn', icon:ICONS.brain, title:'Apprendre', desc:'Session de rappel actif, priorité aux termes dus', meta: dueCards().length+' dus'},
    {id:'cards', icon:ICONS.layers, title:'Cartes', desc:'Parcourir le glossaire librement'},
    {id:'test', icon:ICONS.pencil, title:'Test', desc:'Évaluation chronométrée, 10 questions'},
    {id:'stats', icon:ICONS.chart, title:'Progression', desc:'Détail de chaque terme et prochaine échéance'},
  ];
  items.forEach(it=>{
    const row = el('button','row-link');
    row.innerHTML = `${it.icon}<div class="row-body"><div class="row-title">${it.title}</div><div class="row-desc">${it.desc}</div></div>${it.meta?`<span class="row-meta">${it.meta}</span>`:''}`;
    row.onclick = ()=>{ currentTab = it.id; render(); };
    list.appendChild(row);
  });
  app.appendChild(list);
}

/* ================= PRE-TEST ================= */
function renderPretest(app){
  if(!session || session.mode!=='pretest'){
    const panel = el('div','panel', `
      <h2>Pré-test diagnostique</h2>
      <p>Pour chaque terme, tapez l'abréviation à partir de la définition, ou la définition à partir de
      l'abréviation. Se tromper avant d'avoir étudié est normal : cela ouvre des repères que la session
      Apprendre viendra combler plus efficacement.</p>
    `);
    const btn = el('button','btn', `Démarrer le pré-test (${DATA.length} termes)`);
    btn.onclick = ()=>{
      session = {mode:'pretest', queue:interleave(DATA), i:0, correct:0, results:[]};
      render();
    };
    panel.appendChild(btn);
    app.appendChild(panel);
    return;
  }
  renderRecallScreen(app, {isPretest:true});
}

/* ================= LEARN ================= */
function renderLearn(app){
  if(!session || session.mode!=='learn'){
    const due = interleave(dueCards());
    if(due.length===0){
      const nextDue = Math.min(...DATA.map(c=>progress[c.id].due));
      const wrap = el('div','panel empty-state', `
        ${ICONS.check}
        <h2>Rien à réviser pour l'instant</h2>
        <p>Prochaine échéance : ${fmtDays(nextDue-Date.now())}. Revenir trop tôt n'apporte rien de plus —
        c'est l'espacement qui consolide la mémoire.</p>
      `);
      app.appendChild(wrap);
      return;
    }
    session = {mode:'learn', queue:due, i:0, correct:0, total:due.length};
    render();
    return;
  }
  renderRecallScreen(app, {isPretest:false});
}

/* Determine which question type a card should show */
function questionTypeFor(card, isPretest){
  const st = progress[card.id];
  if(isPretest) return Math.random()<0.5 ? 'written_def_abbr' : 'written_abbr_full';
  if(st.stage===0) return 'mcq_def_abbr';
  if(st.stage===1) return 'mcq_abbr_full';
  if(st.stage===2) return 'written_def_abbr';
  if(st.stage===3) return 'written_abbr_full';
  return Math.random()<0.5 ? 'written_def_abbr' : 'written_abbr_full'; // stage 4: long-term review
}
const STAGE_LABEL = {
  mcq_def_abbr:'choix multiple', mcq_abbr_full:'choix multiple',
  written_def_abbr:'rappel écrit', written_abbr_full:'rappel écrit',
};

function renderRecallScreen(app, opts){
  const s = session;
  if(s.i >= s.queue.length) return renderSessionSummary(app, opts);
  const card = s.queue[s.i];
  const qtype = questionTypeFor(card, opts.isPretest);

  const bar = el('div','progress-track', `<div class="progress-fill" style="width:${Math.round(s.i/s.queue.length*100)}%"></div>`);
  app.appendChild(bar);

  const panel = el('div','panel');
  panel.appendChild(el('div','meta-line', `${ICONS[card.cat]}<span>${CAT_LABELS[card.cat]}</span><span>·</span><span class="stage-tag">${opts.isPretest?'pré-test':STAGE_LABEL[qtype]}</span>`));

  let promptHTML, askAbbr; // askAbbr: true if the expected answer is the abbreviation
  if(qtype==='mcq_def_abbr' || qtype==='written_def_abbr'){
    promptHTML = card.role;
    askAbbr = true;
  } else {
    promptHTML = `<span class="abbr-large">${card.abbr}</span>`;
    askAbbr = false;
  }
  panel.appendChild(el('div','prompt-text', promptHTML));

  if(qtype.startsWith('mcq')){
    const options = shuffle([card, ...distractorsFor(card,3)]);
    const wrap = el('div','choices');
    options.forEach(opt=>{
      const label = askAbbr ? opt.abbr : opt.full;
      const b = el('button','choice-btn', label);
      b.onclick = ()=> handleAnswer(card, opt.id===card.id, panel, b, wrap, opts, qtype, askAbbr);
      wrap.appendChild(b);
    });
    panel.appendChild(wrap);
  } else {
    const row = el('div','input-row');
    const input = document.createElement('input');
    input.type='text';
    input.placeholder = askAbbr ? "Tapez l'abréviation…" : "Tapez le nom complet (en anglais)…";
    input.autocomplete='off';
    const submitBtn = el('button','btn','Valider');
    row.appendChild(input); row.appendChild(submitBtn);
    panel.appendChild(row);
    app.appendChild(panel);
    setTimeout(()=>input.focus(), 20);
    const submit = ()=>{
      const ok = askAbbr ? matchAbbr(input.value, card) : matchFull(input.value, card);
      input.disabled = true; submitBtn.disabled = true;
      handleAnswer(card, ok, panel, null, null, opts, qtype, askAbbr);
    };
    submitBtn.onclick = submit;
    input.addEventListener('keydown', e=>{ if(e.key==='Enter') submit(); });
    return; // panel already appended for the written branch
  }
  app.appendChild(panel);
}

function handleAnswer(card, ok, panel, clickedBtn, choicesWrap, opts, qtype, askAbbr){
  if(choicesWrap){
    const correctLabel = askAbbr ? card.abbr : card.full;
    Array.from(choicesWrap.children).forEach(b=>{
      b.disabled = true;
      if(b.textContent===correctLabel) b.classList.add('correct');
    });
    if(clickedBtn && !ok) clickedBtn.classList.add('wrong');
  }

  const s = session;
  const st = progress[card.id];
  let nextInfo = '';

  if(opts.isPretest){
    s.results.push({card, ok});
    if(ok){ s.correct++; st.stage = Math.max(st.stage, 2); }
  } else {
    if(ok){
      s.correct++;
      if(st.stage < 4){
        st.stage++;
        if(st.stage===4){ st.box=0; st.due=Date.now()+INTERVALS[1]*DAY_MS; nextInfo = 'Terme acquis — première révision '+fmtDays(INTERVALS[1]*DAY_MS); }
        else nextInfo = 'Étape suivante tout de suite après.';
      } else {
        st.box = Math.min(st.box+1,5);
        st.due = Date.now()+INTERVALS[st.box]*DAY_MS;
        nextInfo = 'Prochaine révision '+fmtDays(INTERVALS[st.box]*DAY_MS);
      }
    } else {
      if(st.stage < 4){ st.stage = Math.max(st.stage-1,0); nextInfo = 'Cette étape revient plus tard dans la session.'; }
      else { st.box = Math.max(st.box-1,0); st.due = Date.now(); nextInfo = 'Ce terme revient plus tard dans la session.'; }
      s.queue.push(card);
    }
    saveProgress();
  }

  const fb = el('div','feedback '+(ok?'ok':'ko'));
  fb.innerHTML = `
    <div class="verdict">${ok?'Correct':'Pas tout à fait'}</div>
    <div class="answer">${card.abbr} — ${card.full}</div>
    <div class="role">${card.role}</div>
    ${nextInfo?`<div class="next">${nextInfo}</div>`:''}
  `;
  panel.appendChild(fb);

  const actions = el('div','actions');
  const next = el('button','btn', (s.i+1>=s.queue.length)?'Voir le bilan':'Suivant');
  next.onclick = ()=>{ session.i++; render(); };
  actions.appendChild(next);
  panel.appendChild(actions);
}

function renderSessionSummary(app, opts){
  const s = session;
  const panel = el('div','panel');
  if(opts.isPretest){
    const wrongCount = s.results.filter(r=>!r.ok).length;
    panel.innerHTML = `<h2>Bilan du pré-test</h2>
      <div class="score-big">${s.correct} / ${s.results.length}</div>
      <p>${wrongCount ? `${wrongCount} terme(s) à combler — la session Apprendre va s'en charger en priorité.` : 'Score parfait — place à Apprendre pour consolider dans la durée.'}</p>`;
  } else {
    const mastered = DATA.filter(c=>progress[c.id].stage>=4).length;
    panel.innerHTML = `<h2>Session terminée</h2>
      <div class="score-big">${mastered} / ${DATA.length}</div>
      <p>termes acquis (les 4 étapes validées). Les autres reviendront dans une prochaine session.</p>`;
  }
  const actions = el('div','actions');
  const btn = el('button','btn', opts.isPretest ? 'Aller à Apprendre' : "Retour à l'accueil");
  btn.onclick = ()=>{ session=null; currentTab = opts.isPretest?'learn':'home'; render(); };
  actions.appendChild(btn);
  panel.appendChild(actions);
  app.appendChild(panel);
}

/* ================= CARDS (browse) ================= */
function renderCards(app){
  const card = DATA[browseIndex];
  const flip = el('div','flip-card', `
    <div class="flip-inner">
      <div class="flip-face flip-front">${ICONS[card.cat]}<div class="abbr">${card.abbr}</div></div>
      <div class="flip-face flip-back"><div class="full">${card.full}</div><div class="role">${card.role}</div></div>
    </div>`);
  flip.onclick = ()=>flip.classList.toggle('flipped');
  app.appendChild(flip);

  const nav = el('div','browse-nav');
  const prev = el('button','btn secondary', ICONS.arrowLeft+' Précédent');
  const next = el('button','btn secondary', 'Suivant '+ICONS.arrowRight);
  const pos = el('span','pos', `${browseIndex+1} / ${DATA.length}`);
  prev.onclick = ()=>{ browseIndex=(browseIndex-1+DATA.length)%DATA.length; render(); };
  next.onclick = ()=>{ browseIndex=(browseIndex+1)%DATA.length; render(); };
  nav.appendChild(prev); nav.appendChild(pos); nav.appendChild(next);
  app.appendChild(nav);
}

/* ================= TEST ================= */
function renderTest(app){
  if(!session || session.mode!=='test'){
    const panel = el('div','panel', `<h2>Test chronométré</h2>
      <p>10 questions à choix multiples piochées dans tout le glossaire, sans indice ni retour arrière.</p>`);
    const btn = el('button','btn','Démarrer le test');
    btn.onclick = ()=>{
      session = {mode:'test', queue:interleave(DATA).slice(0,Math.min(10,DATA.length)), i:0, correct:0, results:[]};
      render();
    };
    panel.appendChild(btn);
    app.appendChild(panel);
    return;
  }
  const s = session;
  if(s.i >= s.queue.length){
    const panel = el('div','panel', `<h2>Résultat</h2><div class="score-big">${s.correct} / ${s.queue.length}</div>`);
    const list = el('div');
    s.results.forEach(r=>{
      list.appendChild(el('div','test-row', `<span>${r.card.abbr} — ${r.card.full}</span><span class="${r.ok?'ok':'ko'}">${r.ok?ICONS.check:ICONS.cross}</span>`));
    });
    panel.appendChild(list);
    const actions = el('div','actions');
    const btn = el('button','btn',"Retour à l'accueil");
    btn.onclick = ()=>{ session=null; currentTab='home'; render(); };
    actions.appendChild(btn);
    panel.appendChild(actions);
    app.appendChild(panel);
    return;
  }
  const card = s.queue[s.i];
  const bar = el('div','progress-track', `<div class="progress-fill" style="width:${Math.round(s.i/s.queue.length*100)}%"></div>`);
  app.appendChild(bar);
  const panel = el('div','panel');
  panel.appendChild(el('div','meta-line', `${ICONS[card.cat]}<span>${CAT_LABELS[card.cat]}</span>`));
  panel.appendChild(el('div','prompt-text', card.role));
  const wrap = el('div','choices');
  const options = shuffle([card, ...distractorsFor(card,3)]);
  options.forEach(opt=>{
    const b = el('button','choice-btn', opt.abbr);
    b.onclick = ()=>{
      const ok = opt.id===card.id;
      Array.from(wrap.children).forEach(x=>{ x.disabled=true; if(x.textContent===card.abbr) x.classList.add('correct'); });
      if(!ok) b.classList.add('wrong');
      if(ok) s.correct++;
      s.results.push({card, ok});
      const actions = el('div','actions');
      const nx = el('button','btn', (s.i+1>=s.queue.length)?'Voir le résultat':'Suivant');
      nx.onclick = ()=>{ s.i++; render(); };
      actions.appendChild(nx);
      panel.appendChild(actions);
    };
    wrap.appendChild(b);
  });
  panel.appendChild(wrap);
  app.appendChild(panel);
}

/* ================= STATS ================= */
const STAGE_TEXT = ['choix multiple →abr.','choix multiple →déf.','écrit →abr.','écrit →déf.','acquis'];
function renderStats(app){
  const panel = el('div','panel', `<h2>Détail par terme</h2><p>Étape en cours et prochaine échéance de révision.</p>`);
  const table = el('div','stat-table');
  DATA.forEach(c=>{
    const st = progress[c.id];
    const dueTxt = st.stage<4 ? STAGE_TEXT[st.stage] : (st.due<=Date.now() ? 'dû maintenant' : fmtDays(st.due-Date.now()));
    const cls = (st.stage>=4 && st.due>Date.now()) ? 'due-later' : 'due-now';
    const row = el('div','stat-row', `<span class="name">${ICONS[c.cat]}<span>${c.abbr}</span></span><span class="${cls}">${dueTxt}</span>`);
    table.appendChild(row);
  });
  panel.appendChild(table);
  app.appendChild(panel);
}

/* ================= BOOT ================= */
(async function boot(){
  await loadProgress();
  initMissingCards();
  render();
})();

})();
</script>
